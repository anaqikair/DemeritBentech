<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demerit BenTech</title>
  <link rel="stylesheet" href="style.css?v=2.0" />
</head>
<body>
  <div id="app">
    <div class="bg-blobs"></div>

    <section id="loginView" class="login-screen">
      <div class="login-card glass">
        <div class="brand">
          <div class="brand-mark">DB</div>
          <div>
            <h1>Demerit BenTech</h1>
            <p>Sistem Pengurusan Disiplin & Demerit Maktab</p>
          </div>
        </div>

        <div class="hero-copy">
          <span class="pill">Sistem Rasmi</span>
          <h2>Sistem Pengurusan Disiplin & Demerit Maktab</h2>
          <p>Perekodan disiplin, carian pelajar, dan pemantauan mata demerit untuk Pegawai LDP dan Guru.</p>
        </div>

        <div class="login-form">
          <label>
            Peranan
            <select id="loginRole"></select>
          </label>
          <label>
            Nama Pengguna (Username)
            <input id="loginUsername" type="text" placeholder="Masukkan nama pengguna..." />
          </label>
          <label>
            Kata Laluan (Password)
            <input id="loginPassword" type="password" placeholder="Masukkan kata laluan..." />
          </label>
          <label class="checkbox-label">
            <input id="loginRememberMe" type="checkbox" /> Ingat saya pada peranti ini
          </label>
          <div id="loginErrorMsg" class="login-error hidden"></div>
          <button id="loginBtn" class="btn btn-primary">Log Masuk</button>
        </div>
      </div>
    </section>

    <section id="mainView" class="main-shell hidden">
      <div id="mobileHeader" class="mobile-header glass">
        <div class="brand compact">
          <div class="brand-mark">DB</div>
          <div>
            <h1>Demerit BenTech</h1>
            <p id="mobileSubtitleText">Prototip</p>
          </div>
        </div>
        <button id="mobileMenuBtn" class="btn btn-ghost btn-icon" aria-label="Buka Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>

      <div id="sidebarBackdrop" class="sidebar-backdrop hidden"></div>

      <aside id="appSidebar" class="sidebar glass">
        <div class="sidebar-top">
          <div class="brand compact">
            <div class="brand-mark">DB</div>
            <div>
              <h1>Demerit BenTech</h1>
              <p id="subtitleText">Prototip</p>
            </div>
          </div>

          <div class="user-chip">
            <div class="avatar" id="userAvatar">A</div>
            <div>
              <strong id="userName">Pengguna</strong>
              <p id="userRole">Peranan</p>
            </div>
          </div>
        </div>

        <nav class="nav" id="navTabs"></nav>

        <div class="sidebar-footer">
          <button class="btn btn-danger" id="logoutBtn">Log Keluar</button>
        </div>
      </aside>

        <section id="viewOverview" class="view-stack"></section>
        <section id="viewStudents" class="view-stack hidden"></section>
        <section id="viewReports" class="view-stack hidden"></section>
        <section id="viewPersonal" class="view-stack hidden"></section>
        <section id="viewOffences" class="view-stack hidden"></section>
        <section id="viewUsers" class="view-stack hidden"></section>
        <section id="viewAudit" class="view-stack hidden"></section>
        <section id="viewSettings" class="view-stack hidden"></section>
      </main>
    </section>

    <div id="modalHost" class="modal-host hidden"></div>
  </div>

  <script src="script.js?v=2.0"></script>
</body>
</html>
